name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: camsense-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  prototype:
    name: Python prototype tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r prototype/requirements.txt pytest
      - run: pytest
        working-directory: prototype
